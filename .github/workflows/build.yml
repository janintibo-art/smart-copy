name: Compilation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilation de l'APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renommage
        run: cp app/build/outputs/apk/release/app-release.apk SmartCopy-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: SmartCopy-*.apk

  windows:
    name: EXE Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation
        run: npm install --no-audit --no-fund

      - name: Compilation du .exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: desktop/dist/SmartCopy-*.exe

  release:
    name: Publication
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart Copy — build ${{ github.run_number }}
          body: |
            APK Android : SmartCopy-${{ github.run_number }}.apk
            Windows : version portable (sans installation) ou installateur.
          files: out/*
          make_latest: true
